policy_type: 'scenic'
scenario_category: 'scenic'

route_dir: 'safebench/scenario/scenario_data/route'
scenic_dir: 'safebench/scenario/scenario_data/scenic_data/'
scene_map_dir: 'safebench/scenario/scenario_data/scenic_data_dsf_avoidable/'
sample_num: 50
opt_step: 10
select_num: 2

method: 'scenic'
scenario_id: null
scenario_ids: [1, 3, 5]
route_id: [8, 9]

selection_metric: 'dsf_avoidable'
dsf:
  top_k_percent: 10.0
  speed_unit: 'kmh'
  eval_point: 'midpoint'
  ttc_min_s: 1.0
  drac_max_mps2: 4.0
  require_no_collision: false
  fill_from_all_feasible: true
  param_update: false
  drac_gap_offset_m: 0.0
  min_adv_count: 1
  eps: 0.001

avoidable:
  front_half_deg: 45.0
  detection_m: 5.0
  reaction_s: 0.3
  max_decel_mps2: 8.0
  max_lateral_mps2: 5.0
  max_yaw_rate: 1.0
  collision_radius_m: 2.0
  lookahead_s: 1.0
  band_max_m: 1.0
  ratio_min: 0.35
  explore_margin_min: -1.0
  reset_opt_record: true

ego_action_dim: 2
ego_state_dim: 4
ego_action_limit: 1.0
